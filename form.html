<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Management System</h1>
        </header>

        <!-- Main Dashboard Split Layout -->
        <div class="main-content">
            
            <!-- Left Side: Registration/Edit Form -->
            <div class="form-container">
                <h2 id="form-title">Add New Student</h2>
                <form id="student-form">
                    <input type="hidden" id="student-id">
                    
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" required placeholder="John Doe">
                    </div>
                    
                    <div class="form-group">
                        <label for="roll">Roll Number</label>
                        <input type="text" id="roll" required placeholder="A101">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required placeholder="john@example.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="course">Course / Department</label>
                        <input type="text" id="course" required placeholder="Computer Science">
                    </div>
                     <div class="form-group">
                        <label for="clubs"> Clubs</label>
                        <input type="text" id="clubs" required placeholder="Computer Club ">
                    </div>
                     <div class="form-group">
                        <label for="sports">Sport</label>
                        <input type="text" id="sports" required placeholder="Basketball">
                    </div>
                    
                    <div class="button-group">
                        <button type="submit" id="submit-btn" class="btn btn-primary">Add Student</button>
                        <button type="button" id="cancel-btn" class="btn btn-secondary hidden">Cancel Edit</button>
                    </div>
                </form>
            </div>

            <!-- Right Side: Student Directory & Search -->
            <div class="table-container">
                <div class="table-header">
                    <h2>Student Records</h2>
                    
                </div>
                
                <div class="scrollable-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Roll No</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Course</th>
                                <th>Clubs</th>
                                <th>Sports</th>
                                <th>Actions</th>
                                
                            </tr>
                        </thead>
                        <tbody id="student-table-body">
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
    <script src="musa.js"></script>

    <body>
    </html>
